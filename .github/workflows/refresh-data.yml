# Refresh the conviction dashboard data.
#
# Re-sources the fundamentals snapshot from stockanalysis.com (prices/market
# caps, valuation multiples, 200DMA distance, and the trailing revenue / net-
# margin series), re-scores every name, regenerates docs/conviction.json, runs
# the AGENTS.md validation gate, and commits the result so GitHub Pages
# republishes the site.
#
# Triggers:
#   * workflow_dispatch — the manual "Run workflow" button (Actions tab).
#   * schedule          — weekly, hands-off (Monday 06:00 UTC).
#
# Nothing here uses yfinance (date-corrupted in this repo). The scorer's own
# scrapers already skip the hand-curated / source-corrupted names
# (MU, SMHV.SW, SRUUF), so curated rows are never clobbered.

name: Refresh conviction data

on:
  workflow_dispatch:
    inputs:
      refresh_prices:
        description: "Refresh price-derived fields (market cap, P/S, PEG, 200DMA distance, fwd consensus). Turn OFF to preserve any hand-curated 3Y forward growth values."
        type: boolean
        default: true
  schedule:
    # Weekly, Monday 06:00 UTC. Adjust or add lines to change cadence.
    - cron: "0 6 * * 1"

# Never let two refreshes race on the same branch.
concurrency:
  group: refresh-data
  cancel-in-progress: false

# The job commits and pushes the regenerated data.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PORTFOLIO_USE: ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The scorer is pure-stdlib + local modules — no pip install needed.

      - name: Prepare today's snapshot
        id: snap
        run: |
          set -euo pipefail
          NEWEST=$(ls -1 scoring/fundamentals_*.csv | sort | tail -n1)
          TODAY="scoring/fundamentals_$(date -u +%F).csv"
          # Only ever create/refresh TODAY's file; past snapshots are immutable.
          if [ "$NEWEST" != "$TODAY" ]; then
            cp "$NEWEST" "$TODAY"
            echo "Copied $NEWEST -> $TODAY"
          else
            echo "Refreshing existing $TODAY in place (same-day re-run)"
          fi
          echo "csv=$TODAY" >> "$GITHUB_OUTPUT"

      - name: Refresh price-derived fields
        if: ${{ github.event_name == 'schedule' || inputs.refresh_prices }}
        run: |
          set -euo pipefail
          # --overwrite refreshes mktcap / peg / ps / 200DMA distance / fwd
          # consensus on existing rows (curated net_margin & eps_beat preserved).
          python3 scoring/score_holdings.py --csv "${{ steps.snap.outputs.csv }}" --sync-csv --overwrite --no-fill-ttm

      - name: Refresh trailing revenue & net-margin series
        run: |
          set -euo pipefail
          # --fill-ttm re-sources ttm_rev_growth, rev_growth_hist and
          # net_margin_hist for all held + watchlist names, in place.
          python3 scoring/score_holdings.py --csv "${{ steps.snap.outputs.csv }}" --fill-ttm --watchlist

      - name: Regenerate dashboard JSON
        run: |
          set -euo pipefail
          python3 scoring/score_holdings.py --csv "${{ steps.snap.outputs.csv }}" --json docs/conviction.json

      - name: Refresh Plot-tab price history
        run: |
          set -euo pipefail
          # Fetch ~5y weekly closes for every name in the freshly-regenerated
          # conviction.json and write docs/plot_history.json for the Plot tab.
          # Uses Yahoo's chart HTTP endpoint directly (not the yfinance library
          # that is date-corrupted in the dev env); on the runner it is correct.
          # Write to a temp file first so a rate-limited run can't clobber the
          # committed plot_history.json with a mostly-empty payload.
          python3 scoring/export_plot_history.py --out docs/plot_history.new.json
          # Guard: require at least 80% of names to have a series, else abort and
          # keep the existing plot_history.json (do not publish a broken plot
          # from a rate-limited run).
          python3 -c "import json,sys; \
          new=json.load(open('docs/plot_history.new.json')); \
          conv=json.load(open('docs/conviction.json')); \
          want=len({r['ticker'] for r in conv.get('records',[]) if r.get('ticker')}); \
          got=new.get('count',0); ratio=got/want if want else 0; \
          print(f'plot history coverage: {got}/{want} = {ratio:.0%}'); \
          sys.exit(0 if ratio>=0.80 else 1)" \
            || { echo '::error::Plot history coverage below 80% — likely rate-limited. Keeping previous plot_history.json.'; rm -f docs/plot_history.new.json; exit 1; }
          mv docs/plot_history.new.json docs/plot_history.json

      - name: Validation gate
        run: |
          set -euo pipefail
          # 1. compiles
          python3 -m py_compile scoring/score_holdings.py
          # 2. deterministic — two scoring runs must be byte-identical
          python3 scoring/score_holdings.py --csv "${{ steps.snap.outputs.csv }}" --by-strategy --watchlist > /tmp/r1.txt 2>&1
          python3 scoring/score_holdings.py --csv "${{ steps.snap.outputs.csv }}" --by-strategy --watchlist > /tmp/r2.txt 2>&1
          diff /tmp/r1.txt /tmp/r2.txt
          # 3. allocation + watchlist invariants + CSV<->WATCHLIST coverage
          python3 -c "import portfolio.AI_allocations as m, scoring.score_holdings as S; \
          assert m.verify_allocations() is None; assert m.validate_watchlist() == []; \
          held=set().union(*[set(b.keys()) for _,b in m.ALL_BASKETS])|set(m.STRATEGY.keys()); \
          csv=set(dict(S.load_fundamentals('${{ steps.snap.outputs.csv }}')).keys()); \
          miss=csv-set(m.WATCHLIST)-held; assert not miss, f'uncovered CSV tickers: {sorted(miss)}'; \
          print('PASS')"

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scoring/fundamentals_*.csv docs/conviction.json docs/plot_history.json
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          printf 'Refresh conviction data (%s)\n\nCo-authored-by: Ona <no-reply@ona.com>\n' "$(date -u +%F)" | git commit -F -
          # Push with rebase-and-retry: main can advance during the ~6 min run
          # (a merged PR, another refresh) and reject a plain push. Our commit
          # only rewrites generated data files, so we rebase it onto the new
          # tip. If a concurrent commit touched one of those same generated
          # files, the rebase conflicts — our freshly-regenerated version always
          # wins (--theirs = the commit being replayed during a rebase), so the
          # loop resolves it and retries instead of aborting under `set -e`.
          export GIT_EDITOR=true
          GEN="scoring/fundamentals_*.csv docs/conviction.json docs/plot_history.json"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing on latest main and retrying."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict on generated files — keeping our regenerated versions."
              git checkout --theirs $GEN 2>/dev/null || true
              git add $GEN
              git rebase --continue
            fi
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1

      # ------------------------------------------------------------------
      # Weekly conviction-movers email.
      #
      # Diffs the freshly-committed docs/conviction.json against the previous
      # weekly refresh commit (auto-resolved from git history) and emails a
      # themed HTML report to the owner. Held names are reported even on small
      # drift; non-held names only when they move a lot; the top >7 movers get a
      # layer-attribution "zoom". See docs/email_report_strategy.md.
      #
      # Requires two repo secrets (Settings -> Secrets and variables -> Actions):
      #   MAIL_USERNAME  the Gmail address that sends AND receives the report
      #   MAIL_PASSWORD  a Gmail APP PASSWORD for that account (needs 2FA on)
      # The recipient is that same address. If the secrets are absent the send
      # step is skipped (the data refresh above still succeeds).
      - name: Build movers report
        id: report
        run: |
          set -euo pipefail
          OUT="/tmp/conviction_movers_$(date -u +%F).html"
          python3 scoring/report_conviction_movers.py \
            --current docs/conviction.json \
            --previous - \
            --scope held-plus-big \
            --out-file "$OUT" \
            --out-inline /tmp/inline.html \
            --subject-out /tmp/subject.txt
          echo "subject=$(cat /tmp/subject.txt)" >> "$GITHUB_OUTPUT"
          echo "attach=$OUT" >> "$GITHUB_OUTPUT"

      - name: Email the report
        # Weekly cadence only (schedule) or a manual run for testing. Never on
        # the allocation-edit republish path (that is a different workflow).
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        continue-on-error: true   # a send failure must not fail the data refresh
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.report.outputs.subject }}
          to: ${{ secrets.MAIL_USERNAME }}
          from: "Conviction Bot <${{ secrets.MAIL_USERNAME }}>"
          html_body: file:///tmp/inline.html
          attachments: ${{ steps.report.outputs.attach }}
